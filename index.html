<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">番茄钟</h1>
    <div class="session-label" id="sessionLabel">工作</div>

    <div class="timer-container">
      <svg class="progress-ring" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" class="gradient-start"/>
            <stop offset="100%" class="gradient-end"/>
          </linearGradient>
        </defs>
        <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
        <circle class="progress-ring-progress" id="progressRing" cx="100" cy="100" r="90"/>
      </svg>
      <div class="timer" id="timer">25:00</div>
    </div>

    <div class="stats" id="stats">今日完成：工作 0 次 | 休息 0 次</div>

    <div class="controls">
      <button id="toggleBtn" class="btn btn-primary">开始</button>
      <button id="resetBtn" class="btn btn-secondary">重置</button>
      <button id="settingsBtn" class="btn btn-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>

    <button id="themeBtn" class="btn btn-theme">浅色主题</button>
  </div>

  <div id="settingsPanel" class="settings-panel">
    <h2>设置</h2>
    <div class="setting-item">
      <label>工作时长（分钟）</label>
      <input type="number" id="workDuration" min="1" max="120" value="25">
    </div>
    <div class="setting-item">
      <label>休息时长（分钟）</label>
      <input type="number" id="breakDuration" min="1" max="60" value="5">
    </div>
    <div class="setting-item">
      <button id="resetStatsBtn" class="btn btn-small">重置统计</button>
    </div>
    <button id="closeSettingsBtn" class="btn">关闭</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
