<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">番茄钟</h1>
    <div class="session-label" id="sessionLabel">工作</div>
    <div class="timer" id="timer">25:00</div>
    <div class="stats" id="stats">今日完成：工作 0 次 | 休息 0 次</div>
    <div class="controls">
      <button id="toggleBtn" class="btn">开始</button>
      <button id="resetBtn" class="btn btn-secondary">重置</button>
      <button id="settingsBtn" class="btn btn-secondary">设置</button>
    </div>
    <button id="themeBtn" class="btn btn-theme">浅色</button>
  </div>

  <div id="settingsPanel" class="settings-panel" style="display: none;">
    <h2>设置</h2>
    <div class="setting-item">
      <label>工作时长（分钟）</label>
      <input type="number" id="workDuration" min="1" max="120" value="25">
    </div>
    <div class="setting-item">
      <label>休息时长（分钟）</label>
      <input type="number" id="breakDuration" min="1" max="60" value="5">
    </div>
    <div class="setting-item">
      <button id="resetStatsBtn" class="btn btn-small">重置统计</button>
    </div>
    <button id="closeSettingsBtn" class="btn">关闭</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
